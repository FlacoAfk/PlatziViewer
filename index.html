<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0f1a">
    <title>Platzi Learning Path</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="css/main.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p style="margin-top: 1rem; color: var(--text-muted)">Cargando plataforma...</p>
        </div>
    </div>

    <script>
        window.__platziBootDone = false;
        window.setTimeout(() => {
            if (window.__platziBootDone) return;
            const app = document.getElementById('app');
            if (!app) return;
            app.innerHTML = `
                <div class="loading">
                    <div style="font-size: 3rem; margin-bottom: 1rem">⚠️</div>
                    <p style="color: var(--text-secondary)">La plataforma no terminó de iniciar</p>
                    <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.85rem">
                        Haz un recargo forzado (<code style="background: var(--bg-card); padding: 4px 8px; border-radius: 4px">Ctrl + F5</code>) o reinicia el servidor.
                    </p>
                </div>
            `;
        }, 12000);
    </script>

    <!-- New Modular App Entry -->
    <script type="module" src="js/app_v2.js?v=3"></script>
</body>

</html>
